spring:
  application:
    name: ai-interview-agent
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:13307/ai_interview?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8080
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-at-least-256-bits-change-in-production}
  access-expiration: 7200000
  refresh-expiration: 604800000

sandbox:
  docker-host: unix:///var/run/docker.sock
  cpu-count: 1
  memory-limit: 512m
  memory-swap: 512
  pids-limit: 64
  timeout-seconds: 30
  java-image: eclipse-temurin:21-jdk-alpine
  python-image: python:3.12-slim
  max-pool-size: 3