spring:
  application:
    name: ai-interview-agent
  config:
    import: optional:classpath:application-local.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:13307/ai_interview?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:change-me}
      chat:
        observations:
          log-prompt: true
          log-completion: true
        options:
          model: qwen3.7-max-2026-05-17
          enable-thinking: true
      embedding:
        options:
          model: text-embedding-v3
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8080
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-at-least-256-bits-change-in-production}
  access-expiration: 7200000
  refresh-expiration: 604800000

observability:
  cost:
    # 模型单价（元 / 千 token），按 DashScope 控制台价格配置
    input-per-1k: 0.0024
    output-per-1k: 0.0096
  retention-days: 30
  # prompt/回复存储长度上限：-1 表示存全文（默认，受 12000 字硬上限保护）；正整数表示截断到该字数
  prompt-excerpt-length: -1

sandbox:
  docker-host: unix:///var/run/docker.sock
  cpu-count: 1
  memory-limit: 512m
  memory-swap: 512
  pids-limit: 64
  timeout-seconds: 30
  java-image: eclipse-temurin:21-jdk-alpine
  python-image: python:3.12-slim
  max-pool-size: 3