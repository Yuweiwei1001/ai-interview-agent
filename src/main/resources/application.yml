spring:
  application:
    name: ai-interview-agent
  config:
    import: optional:classpath:application-local.yml
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  datasource:
    url: jdbc:mysql://localhost:13307/ai_interview?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:change-me}
      chat:
        observations:
          log-prompt: true
          log-completion: true
        options:
          model: qwen3.7-max-2026-05-17
          enable-thinking: true
      embedding:
        options:
          model: qwen3.7-text-embedding
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
server:
  port: 8080
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 语音面试（ASR/TTS 实时通道，DashScope qwen-audio-3.0-asr-flash-streaming / qwen-audio-3.0-tts-plus）
# api-key 复用 DASHSCOPE_API_KEY 环境变量；未配置时语音链路自动降级（ASR/TTS 静默失败，文本流程不受影响）
interview:
  voice:
    enabled: true
    asr:
      api-key: ${DASHSCOPE_API_KEY:}
    tts:
      api-key: ${DASHSCOPE_API_KEY:}
    # ASR corpus 热词偏置（ASR 热词纠错方案 4.2）：会话级热词喂给 ASR 引擎，从识别阶段减少术语错误。
    # 默认关闭：待 P1 corpus A/B 实验验证术语正确率提升、幻觉率可接受后再并默认；关闭即完全不传 corpus
    corpus:
      enabled: false
      max-terms: 100                          # corpus 词表上限（幻觉爆炸半径控制）
      hallucination-edit-distance-threshold: 0.2   # final 与 corpus 拼接串归一化编辑距离 ≤ 此值判疑似幻觉（suspect 标记下发，不丢弃）
    # 后处理术语纠错（ASR 热词纠错方案 4.4）：final 定稿后异步保守纠错，建议式交互由候选人终审；失败永不阻塞字幕
    correction:
      enabled: true
      model: qwen3.7-flash               # 关 thinking 的轻量模型（多模态模型，经 LightweightLlmClient 走 multimodal-generation 端点）
      timeout-ms: 3000                        # 超时即回退原文
      recall-top-k: 20                        # 拼音召回候选数

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-at-least-256-bits-change-in-production}
  access-expiration: 7200000
  refresh-expiration: 604800000

observability:
  cost:
    # 模型单价（元 / 千 token），按 DashScope 控制台价格配置
    input-per-1k: 0.0024
    output-per-1k: 0.0096
  retention-days: 30
  # prompt/回复存储长度上限：-1 表示存全文（默认，受 12000 字硬上限保护）；正整数表示截断到该字数
  prompt-excerpt-length: -1

sandbox:
  docker-host: unix:///var/run/docker.sock
  cpu-count: 1
  memory-limit: 512m
  memory-swap: 512
  pids-limit: 64
  timeout-seconds: 30
  java-image: eclipse-temurin:21-jdk-alpine
  python-image: python:3.12-slim
  max-pool-size: 3